    `main` `46fbaa7`.


    **What is verified:** paths, HTTP methods, which endpoints are public, the authentication scheme, the response
    envelopes, pagination, and the query parameters listed.


    **What is summarised:** most request bodies are shown as generic objects and most `data` payloads are not modelled
    field by field. The route file named in each tag description is the source of truth for field-level detail and
    role rules.


    Narrative overview: [`docs/API.md`](../API.md). Single version (`v1`); compatibility is managed by app build
    number (`X-App-Build`), not by URL versions.'
