      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      - name: search
        in: query
        schema:
          type: string
        description: Name or code; phone only for PII roles.
      - name: status
        in: query
        schema:
          type: string
          enum:
          - active
          - warning
          - inactive
          - archived
      - name: gender
        in: query
        schema:
          type: string
          enum:
          - male
          - female
      - name: section
        in: query
        schema:
          type: string
      - name: age_group
        in: query
        schema:
          type: string
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - name
          - newest
          - oldest
          - code
          default: name
