components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: FKSS HMAC token (not a JWT)
      description: Access token from `/auth/login` or `/auth/refresh-token`, sent only in the `Authorization` header.
        Format `<base64 payload>.<hex HMAC-SHA256>`; lifetime 15 minutes. Query-string tokens are rejected.
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
      description: Client-generated key. A replay with the same key returns the stored response instead of writing
        twice.
  schemas:
    SuccessEnvelope:
      type: object
      required:
      - status
      properties:
        status:
          const: success
        message:
          type: string
          description: Present when the handler returns a message.
        data:
          description: Payload; shape depends on the endpoint.
    ErrorEnvelope:
      type: object
      required:
      - status
      - message
      properties:
        status:
          const: error
        message:
          type: string
          description: Human-readable message.
        code:
          type: string
          description: Machine code when provided, e.g. `INVALID_REFRESH_TOKEN`, `HR_ATTENDANCE_RETIRED`.
      additionalProperties: true
    PaginatedEnvelope:
      allOf:
      - $ref: '#/components/schemas/SuccessEnvelope'
      - type: object
        properties:
          data:
            type: object
            properties:
              items:
                type: array
                items:
                  type: object
              pagination:
                $ref: '#/components/schemas/Pagination'
    Pagination:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        pages:
          type: integer
        has_more:
          type: boolean
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    RefreshRequest:
      type: object
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string
    LoginResult:
      type: object
      properties:
        token:
          type: string
          description: Access token (15 minutes).
        refresh_token:
          type: string
          description: Rotating refresh token (90-day session).
        expires_in:
          type: integer
          description: Access-token lifetime in seconds.
        user:
          type: object
          properties:
            id:
              type: integer
            username:
              type: string
            full_name:
              type: string
            email:
              type:
              - string
              - 'null'
            role:
              type: string
            is_active:
              type: boolean
            profile_image:
              type: object
              properties:
                present:
                  type: boolean
                version:
                  type:
                  - string
                  - 'null'
                url:
                  type:
                  - string
                  - 'null'
            profile_version: {}
            authorization_version:
              type: integer
              minimum: 1
    WarningClose:
      type: object
      required:
      - outcome
      properties:
        outcome:
          type: string
        note:
          type: string
    EnrollRequest:
      type: object
      required:
      - member_id
      - class_id
      properties:
        member_id:
          type: integer
        class_id:
          type: integer
  responses:
    BadRequest:
      description: Missing or invalid input.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing, invalid or expired token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Role or scope does not allow this, or the feature is disabled for this deployment.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Unknown resource, endpoint or record.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    MethodNotAllowed:
      description: HTTP method not supported.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: State conflict, for example an already-submitted sheet, `WORKFLOW_REJECTED`, or a stale `profile_version`
        (`PROFILE_CONFLICT`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PayloadTooLarge:
      description: Upload too large.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unprocessable:
      description: Validation failed (for example `INVALID_SCORES`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: Rate limit reached.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Gone:
      description: Endpoint retired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServerError:
      description: The service could not complete the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
