    post:
      tags:
      - auth
      summary: Rotate a refresh token (one-time use).
      operationId: postAuthRefreshToken
      description: Rotate a refresh token (one-time use). Replaying an old refresh token revokes the whole token
        family.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
