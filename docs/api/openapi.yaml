    get:
      tags:
      - service
      summary: API information (name, version, status).
      operationId: get
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'
