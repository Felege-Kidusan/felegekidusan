name: APK upload browser acceptance (synthetic)
on:
  workflow_dispatch:
    inputs:
      size_mib:
        description: 'Synthetic APK padding size in MiB (16..511; default >300 MB)'
        default: '320'
        required: true
      upload_kib:
        description: 'Chromium upload cap in KiB/s (256 is about 2.1 Mbps)'
        default: '256'
        required: true
permissions:
  contents: read
jobs:
  browser-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated browser test tools
        run: |
          python -m pip install -r tests/e2e/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verify native timeout recovery at 8 KiB per second
        run: python -u tests/e2e/apk_slow_link_probe.py --output browser-evidence/very-slow
      - name: Verify exact 512 MiB limit with actual browser and PHP
        run: |
          python -u tests/e2e/apk_upload_browser.py --size-mib 511 --exact-limit \
            --upload-kib 16384 --latency-ms 10 --timeout 600 --output browser-evidence/exact-limit
      - name: Run actual browser and PHP upload with interruption and reload
        env:
          TEST_SIZE_MIB: ${{ inputs.size_mib }}
          TEST_UPLOAD_KIB: ${{ inputs.upload_kib }}
        run: |
          python -u tests/e2e/apk_upload_browser.py \
            --size-mib "$TEST_SIZE_MIB" --upload-kib "$TEST_UPLOAD_KIB" \
            --latency-ms 250 --timeout 1800 --output browser-evidence/large
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-browser-evidence
          path: browser-evidence/
          retention-days: 14
