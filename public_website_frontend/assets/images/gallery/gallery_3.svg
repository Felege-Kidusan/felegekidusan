<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1111" />
      <stop offset="50%" stop-color="#551515" />
      <stop offset="100%" stop-color="#1F0808" />
    </linearGradient>
    <linearGradient id="goldG3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE590" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#grad3)"/>
  
  <!-- Open Bible & Light Motif -->
  <g transform="translate(300, 150)">
    <!-- Radiance -->
    <circle cx="0" cy="0" r="80" fill="rgba(212,175,55,0.12)"/>
    <!-- Open Holy Book -->
    <path d="M -60 -30 Q 0 -45 0 20 L 0 50 Q -30 30 -60 40 Z" fill="#FFFDF8" stroke="url(#goldG3)" stroke-width="2"/>
    <path d="M 60 -30 Q 0 -45 0 20 L 0 50 Q 30 30 60 40 Z" fill="#FFFDF8" stroke="url(#goldG3)" stroke-width="2"/>
    <!-- Text lines -->
    <path d="M -45 -10 L -15 -15 M -45 5 L -15 0 M -45 20 L -15 15" stroke="#800000" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 45 -10 L 15 -15 M 45 5 L 15 0 M 45 20 L 15 15" stroke="#800000" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Cross on spine -->
    <path d="M 0 -45 L 0 50" stroke="url(#goldG3)" stroke-width="3"/>
    <path d="M -10 -55 L 10 -55 M 0 -65 L 0 -45" stroke="url(#goldG3)" stroke-width="2.5"/>
  </g>
  
  <!-- Banner -->
  <rect x="50" y="310" width="500" height="60" rx="12" fill="rgba(0,0,0,0.6)" stroke="url(#goldG3)" stroke-width="1.5"/>
  <text x="300" y="336" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Bible Study &amp; Ge'ez Workshop</text>
  <text x="300" y="356" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="400" fill="#E5C158">የመጽሐፍ ቅዱስና የግዕዝ አውደ-ጥናት</text>
</svg>
