      <stop offset="0%" stop-color="#401B00" />
      <stop offset="50%" stop-color="#703207" />
      <stop offset="100%" stop-color="#281100" />
    </linearGradient>
    <linearGradient id="goldG5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE590" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#grad5)"/>
  
  <!-- Sacred Art / Palette Motif -->
  <g transform="translate(300, 150)">
