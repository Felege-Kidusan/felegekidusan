name: fkss_app
description: FKSS Sunday School Management System — Mobile App
publish_to: 'none'
version: 1.1.16+18

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP & API
  http: ^1.2.0

  # Category cover images — pick from gallery (uploads go through the
  # same hardened validator as the web manager).
  image_picker: ^1.1.2

  # Phone radio (Wi‑Fi / 4G / none) — Telegram-style "Waiting for network"
  connectivity_plus: ^6.1.4

  # App Lock: device biometrics (BiometricPrompt / LocalAuthentication).
  # Requires FlutterFragmentActivity on Android (MainActivity.kt).
  local_auth: ^2.2.0
  
  # Local storage (for JWT token — encrypted)
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.2.0
  
  # State management
  provider: ^6.1.0
  
  # Icons
  cupertino_icons: ^1.0.6
  flutter_feather_icons: ^2.0.0+1
  
  # Pull to refresh
  pull_to_refresh_flutter3: ^2.0.2
  
  # Loading indicators
  shimmer: ^3.0.0
  
  # Date formatting
  intl: ^0.19.0

  # QR-scan attendance taking (Phase 8): on-device ML Kit decoding,
  # works fully offline; scans persist via the sqflite outbox below.
  mobile_scanner: ^5.2.3

  # Offline cache storage. The local DB is a sandboxed cache of server data;
  # at-rest protection comes from the OS (app sandbox + device file-based
  # encryption, the mainstream pattern). Tokens and the staff profile stay in
  # platform secure storage (flutter_secure_storage above).
  sqflite: ^2.3.0
  path: ^1.8.0
  crypto: ^3.0.3

  # P0 mezmur audio player — streaming playback with background support.
  # just_audio is the playback engine; just_audio_background (built on
  # audio_service) adds the media notification, lock-screen transport +
  # headset buttons for its single auto-managed player.
  # audio_service is a DIRECT dependency so its public types (MediaItem,
  # AudioProcessingState…) resolve in app code, and audio_session lets
  # us configure the shared session for music (interruptions/ducking).
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  # Android 13+ will not show the media notification (and therefore no
  # lock-screen transport) unless POST_NOTIFICATIONS is granted at
  # runtime; declaring it in the manifest alone is not enough.
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  
  assets:
    - assets/

  fonts:
    - family: NotoSansEthiopic
      fonts:
        - asset: assets/fonts/NotoSansEthiopic-Regular.ttf
        - asset: assets/fonts/NotoSansEthiopic-Bold.ttf
          weight: 700


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "../logo_felege_kidusan.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "../logo_felege_kidusan.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: "../logo_felege_kidusan.png"
  android_12:
    image: "../logo_felege_kidusan.png"
    color: "#FFFFFF"

