plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.arkeonethiopia.fkss"
    compileSdk = flutter.compileSdkVersion
    // NDK 26.1 is PINNED DELIBERATELY — do not "fix" the warning.
    //
    // Flutter prints a notice that plugins request 27.0.12077973. That
    // notice is advisory: this app ships NO native C/C++ of its own
    // (no externalNativeBuild, no CMakeLists under android/), so the
    // NDK is never actually invoked during an Android build. The
    // plugins ship prebuilt .so files.
    //
    // P47 bumped this to 27.0.12077973 and the build broke immediately:
    //   [CXX1101] NDK at C:\Android\ndk\27.0.12077973 did not have a
    //   source.properties file
    // because that NDK is not installed (or is a partial download) on
    // the build machine, and fetching it is a ~1 GB download — a real
    // cost on a slow connection, for zero benefit to this app.
    //
    // 26.1.10909125 is the version that provably produces a working
    // 44.5 MB release APK here. Revisit ONLY if this app gains its own
    // native code, or a plugin genuinely fails to link.
    ndkVersion = "26.1.10909125"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.arkeonethiopia.fkss"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}


